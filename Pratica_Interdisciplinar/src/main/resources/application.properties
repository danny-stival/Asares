spring.application.name=financas

# --- Conexao PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/financasdb
spring.datasource.username=postgres
spring.datasource.password=1207
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desativa H2 em definitivo
spring.h2.console.enabled=false

# --- Seguranca / JWT ---
app.jwt.secret=troque-esta-chave-por-uma-bem-longa-e-secreta-em-producao-0123456789
app.jwt.expiration-ms=86400000